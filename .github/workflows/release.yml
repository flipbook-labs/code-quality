name: Release

on:
  push:
    branches: [main]
  pull_request:
    # Labeling a PR with `debug:release-pr` runs the release flow without releasing.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force-version:
        description: "Open a publish PR that sets this exact version (e.g. 1.2.3)"
        default: ""
        required: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  release:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Locking in this job, before any release work, guarantees the unlock at
      # the end runs after it.
      - name: Lock the publish PR
        if: github.event_name == 'push'
        uses: flipbook-labs/changewrite/publish-lock@v0.16.0
        with:
          locked: true
          url: ${{ env.RUN_URL }}

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLIPBOOK_BACKEND_CLIENT_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The App token makes the publish PR's pushes trigger CI.
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: flipbook-labs/changewrite@v0.16.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-token: ${{ steps.app-token.outputs.token }}
          force-version: ${{ inputs.force-version || '' }}
          debug: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug:release-pr') }}
          pr-body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and rolling the
            > pending `.changes/` entries into the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `{{tag}}`
            > 2. Create a GitHub release for that tag

            <details>
            <summary><b>GitHub Release preview</b></summary>

            # {{tag}}

            {{notes}}
            </details>

            Next release will be available here:
            {{repo_url}}/releases/tag/{{tag}}

            🤖 This PR was generated by [this run]({{run_url}}).

      - name: Unlock the publish PR
        if: github.event_name == 'push'
        uses: flipbook-labs/changewrite/publish-lock@v0.16.0
        with:
          locked: false
          url: ${{ env.RUN_URL }}
