name: Refresh Roblox API

# The `deprecated` lint checks Roblox APIs against
# src/generated/robloxApiData.luau, which is generated from the API dump of the
# latest Studio build. Roblox ships Studio about once a week, so this
# regenerates the file every day and opens a PR, or updates the open one, when
# its deprecations or messages change.

on:
  schedule:
    # Every day at 15:00 UTC. The hour doesn't matter; a new Studio build
    # waits at most a day to be picked up.
    - cron: "0 15 * * *"
  workflow_dispatch:

env:
  BRANCH: roblox-api-refresh
  DATA_PATH: src/generated/robloxApiData.luau
  ENTRY_PATH: .changes/roblox-api-refresh.md

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: refresh-roblox-api
    steps:
      # PRs and pushes made with the default token don't trigger other
      # workflows, so CI would never run on the refresh PR. The App token's do.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLIPBOOK_BACKEND_CLIENT_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Regenerate
        run: lute run generate-roblox-api

      # The Studio version in the file changes with every build, even when no
      # deprecation does, so a change to that line alone isn't worth a PR.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -I 'studioVersion' -- "$DATA_PATH"; then
            echo "No deprecations or messages changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(grep -oE 'version-[0-9a-f]+' "$DATA_PATH" | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.changes.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # CI requires a changelog entry on every PR. The refresh changes
          # what `deprecated` reports, so it gets one.
          cat > "$ENTRY_PATH" <<EOF
          ---
          bump: patch
          category: Changes
          kind: rules
          ---

          Refresh the Roblox APIs \`deprecated\` checks to Studio \`$VERSION\`.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$DATA_PATH" "$ENTRY_PATH"
          git commit -m "Refresh Roblox API data to $VERSION"

          # The branch belongs to this job and is rebuilt from main on every
          # run. When the open PR already holds the same data on top of the
          # current main, pushing again would only rerun its CI.
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ] \
            && git fetch origin "$BRANCH" 2>/dev/null \
            && git merge-base --is-ancestor origin/main FETCH_HEAD \
            && git diff --quiet -I 'studioVersion' FETCH_HEAD HEAD -- "$DATA_PATH"; then
            echo "The open PR is already up to date."
            exit 0
          fi
          git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Roblox's API dump for Studio \`$VERSION\` changes which APIs \`deprecated\` flags, or what it says about them. This PR regenerates \`$DATA_PATH\` with \`lute run generate-roblox-api\`.

          🤖 This PR was generated by [this run]($RUN_URL).
          EOF
          title="Refresh Roblox API data to $VERSION"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
